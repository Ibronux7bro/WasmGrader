name: CI - Moodle WASM Evaluator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  rust-backend:
    name: Build & Test Rust Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cargo Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
        continue-on-error: true

      - name: Build All Crates
        run: cargo build --manifest-path backend/Cargo.toml --all-targets

      - name: Run Engine & Integration Tests
        run: cargo test --manifest-path backend/Cargo.toml

  php-moodle-plugin:
    name: Lint & Validate Moodle Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, xml

      - name: Check PHP Syntax
        run: |
          find moodle_plugin -name "*.php" -exec php -l {} \;

  docker-build:
    name: Test Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: moodle-wasm-evaluator:latest
