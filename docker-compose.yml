
services:
  # 1. High-Performance Rust WASM Sandbox Evaluator Daemon
  wasm-evaluator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodle-wasm-evaluator
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=info
      - API_SECRET_KEY=${API_SECRET_KEY:-moodle_wasm_secret_key_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
    restart: unless-stopped
    networks:
      - wasm-network

  # 2. Moodle Learning Management System (LMS)
  moodle:
    image: moodlehq/moodle-php-apache:8.2
    container_name: moodle-server
    ports:
      - "80:80"
    environment:
      - MOODLE_DOCKER_DBTYPE=mariadb
      - MOODLE_DOCKER_DBHOST=mariadb
      - MOODLE_DOCKER_DBNAME=bitnami_moodle
      - MOODLE_DOCKER_DBUSER=bn_moodle
      - MOODLE_DOCKER_DBPASS=bitnami
      - APACHE_DOCUMENT_ROOT=/var/www/html
    volumes:
      - moodle_data:/var/www/moodledata
    depends_on:
      - mariadb
      - wasm-evaluator
    restart: unless-stopped
    networks:
      - wasm-network

  # 3. Relational Database Backend for Moodle
  mariadb:
    image: bitnami/mariadb:latest
    container_name: moodle-mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=bitnami
      - MARIADB_DATABASE=bitnami_moodle
    volumes:
      - mariadb_data:/bitnami/mariadb
    restart: unless-stopped
    networks:
      - wasm-network

volumes:
  mariadb_data:
    driver: local
  moodle_data:
    driver: local
  moodledata_data:
    driver: local

networks:
  wasm-network:
    driver: bridge
