
services:
  # 1. High-Performance Rust WASM Sandbox Evaluator Daemon
  wasm-evaluator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodle-wasm-evaluator
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=info
      - API_SECRET_KEY=${API_SECRET_KEY:-moodle_wasm_secret_key_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
    restart: unless-stopped
    networks:
      - wasm-network

  # 2. Moodle Learning Management System (LMS)
  moodle:
    image: bitnamilegacy/moodle:4.4
    container_name: moodle-server
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=AdminPassword123!
      - MOODLE_EMAIL=admin@example.com
      - MARIADB_HOST=mariadb
      - MARIADB_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_PASSWORD=bitnami
      - MOODLE_DATABASE_NAME=bitnami_moodle
    volumes:
      - moodle_data:/bitnami/moodle
      - ./moodle_plugin/assign/submission/wasmcode:/opt/bitnami/moodle/mod/assign/submission/wasmcode
    depends_on:
      - mariadb
      - wasm-evaluator
    restart: unless-stopped
    networks:
      - wasm-network

  # 3. Relational Database Backend for Moodle
  mariadb:
    image: bitnami/mariadb:latest
    container_name: moodle-mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=bitnami
      - MARIADB_DATABASE=bitnami_moodle
    volumes:
      - mariadb_data:/bitnami/mariadb
    restart: unless-stopped
    networks:
      - wasm-network

volumes:
  mariadb_data:
    driver: local
  moodle_data:
    driver: local

networks:
  wasm-network:
    driver: bridge
