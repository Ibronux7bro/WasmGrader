
services:
  # 1. High-Performance Rust WASM Sandbox Evaluator Daemon
  wasm-evaluator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodle-wasm-evaluator
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=info
      - API_SECRET_KEY=${API_SECRET_KEY:-moodle_wasm_secret_key_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
    restart: unless-stopped
    networks:
      - wasm-network

  # 2. Moodle Learning Management System (LMS)
  moodle:
    build:
      context: ./moodle_docker
      dockerfile: Dockerfile
    image: wasmgrader-moodle:latest
    container_name: moodle-server
    ports:
      - "80:80"
    environment:
      - MOODLE_DB_HOST=mariadb
      - MOODLE_DB_PORT=3306
      - MOODLE_DB_USER=bn_moodle
      - MOODLE_DB_PASS=bitnami
      - MOODLE_DB_NAME=bitnami_moodle
      - MOODLE_ADMIN_USER=admin
      - MOODLE_ADMIN_PASS=AdminPassword123!
      - MOODLE_ADMIN_EMAIL=admin@wasmgrader.local
      - WASM_API_URL=http://wasm-evaluator:8080
      - WASM_API_KEY=moodle_wasm_secret_key_2026
    volumes:
      - moodle_data:/var/moodledata
      - ./moodle_plugin/assign/submission/wasmcode:/wasmcode_plugin
    depends_on:
      - mariadb
      - wasm-evaluator
    restart: unless-stopped
    networks:
      - wasm-network

  # 3. Relational Database Backend for Moodle
  mariadb:
    image: bitnami/mariadb:latest
    container_name: moodle-mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=bitnami
      - MARIADB_DATABASE=bitnami_moodle
    volumes:
      - mariadb_data:/bitnami/mariadb
    restart: unless-stopped
    networks:
      - wasm-network

volumes:
  mariadb_data:
    driver: local
  moodle_data:
    driver: local
  moodledata_data:
    driver: local

networks:
  wasm-network:
    driver: bridge
